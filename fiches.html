<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches mémo conseiller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Une fiche = une feuille A4 recto-verso. Style banque : blanc, filets fins, vert en accent. */
:root{--ink:#111816;--muted:#6B7570;--green:#007A55;--green-dark:#005C40;--green-soft:#EEF6F2;--line:#E5E9E7;--soft:#F5F7F6;--gold:#B7791F;--gold-soft:#FBF4E6;--bad:#C2372D;--surface:#FFFFFF;
  --body:"Inter",Arial,sans-serif;color-scheme:light}
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#F1F3F2;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
p{margin:0}
.toolbar{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
.toolbar button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.sheet{width:210mm;height:297mm;margin:8mm auto;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.08);position:relative;overflow:hidden;display:flex;flex-direction:column;font-size:9.6pt;line-height:1.45}
.head{flex:none;padding:12mm 15mm 0}
.kicker{font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:600;display:flex;align-items:center;gap:3mm}
.kicker::before{content:"";width:6mm;height:.7mm;background:var(--green);border-radius:1mm}
.head h1{font-size:24pt;line-height:1.1;margin:2mm 0 4mm;font-weight:700;letter-spacing:-.025em}
.intro{background:var(--green-soft);border-radius:3mm;padding:3.5mm 4.5mm;font-size:10.8pt;line-height:1.5}
.intro small{display:block;font-size:7pt;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:1mm}
.body{padding:6mm 15mm 16mm;display:flex;flex-direction:column;gap:6mm;flex:1}
h2{font-size:8pt;text-transform:uppercase;letter-spacing:.12em;color:var(--green);font-weight:700;margin:0 0 3mm;display:flex;align-items:center;gap:2.5mm}
h2::after{content:"";flex:1;height:.3mm;background:var(--line)}
.points{display:grid;grid-template-columns:1fr 1fr;gap:3.5mm 7mm}
.pt{display:flex;gap:3mm}
.pt>span{flex:none;width:5.5mm;height:5.5mm;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:700;font-size:8pt;display:grid;place-items:center}
.pt b{display:block;font-size:10pt;font-weight:600;margin-bottom:.5mm}
.pt p{color:#3C4642}
.chif{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm}
.c{background:var(--soft);border-radius:2.5mm;padding:2.5mm 3.5mm}
.c small{display:block;font-size:7.6pt;color:var(--muted)}
.c b{display:block;font-size:10.2pt;font-weight:700;margin:.4mm 0}
.c p{font-size:8.4pt;color:#3C4642;line-height:1.38}
.schemas{display:grid;gap:3mm}
.schemas.two{grid-template-columns:1fr 1fr}
.schema{border:1px solid var(--line);border-radius:2.5mm;padding:3mm 4mm}
.schema h3{margin:0 0 1.5mm;font-size:8.8pt;font-weight:600}
.schema svg text{font-family:var(--body)}
.schema svg{max-height:62mm;width:100%}
.ex{border:1px solid #EBDDBF;border-radius:3mm;padding:4mm 5mm}
.ex .t{font-weight:600;font-size:10.2pt;margin-bottom:2mm}
.ex ol{margin:0;padding-left:5mm;display:flex;flex-direction:column;gap:1.2mm;font-variant-numeric:tabular-nums}
.ex li::marker{color:var(--gold);font-weight:700}
.ex .c2{margin-top:3mm;background:var(--gold-soft);border-radius:2mm;padding:2.2mm 3mm;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:7mm}
.pg{display:flex;flex-direction:column;gap:2.8mm}
.pg>div{border-left:.7mm solid var(--bad);padding-left:3mm}
.pg b{display:block;font-weight:600}
.pg p{color:#3C4642;font-size:9pt}
dl{margin:0;display:flex;flex-direction:column;gap:2mm}
dt{font-weight:600}
dd{margin:0;color:#3C4642;font-size:9pt}
.bubble{border-left:.8mm solid var(--green);padding:1mm 0 1mm 4mm;font-style:italic;color:#2B3330;font-size:10.4pt;line-height:1.5}
.foot{position:absolute;left:15mm;right:15mm;bottom:6mm;display:flex;justify-content:space-between;font-size:6.8pt;color:var(--muted);border-top:1px solid var(--line);padding-top:1.8mm}
.recto2 .body{padding-top:12mm}
.cover .head{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30mm 22mm;border:0}
.cover h1{font-size:34pt;max-width:140mm}
.cover .lead{font-size:12pt;color:var(--muted);max-width:130mm;line-height:1.5}
.cover .toc{columns:2;column-gap:12mm;font-size:10pt;line-height:2;margin-top:12mm;border-top:1px solid var(--line);padding-top:6mm}
.cover .toc span{color:var(--green);font-weight:600;display:inline-block;width:8mm}
@media print{html,body{background:#fff}.toolbar{display:none}.sheet{margin:0;box-shadow:none;page-break-after:always}}
</style>
</head>
<body>
<div class="toolbar"><span>Fiches mémo · une feuille recto-verso par thème</span><button type="button" id="print">Imprimer ou enregistrer en PDF</button></div>
<main id="root"></main>
<script src="fiches.js"></script>
<script>
(function(){
const root = document.getElementById("root");
const e = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.getElementById("print").addEventListener("click", () => { try { window.print(); } catch(err){} });
fetch("questions.json").then(r => r.json()).then(d => {
  const only = location.hash.slice(1);
  const units = only ? d.units.filter(u => u.id === only) : d.units;
  let html = "";
  if (!only){
    html += '<section class="sheet cover"><div class="head"><div class="kicker">Learn JC</div><h1>Fiches mémo du conseiller</h1><p class="lead">' + d.units.length + ' fiches recto-verso : comment ça marche, les chiffres expliqués, des schémas, un exemple chiffré, les pièges, les mots à comprendre et la phrase à dire au client.</p><div class="toc">' +
      d.units.map((u, i) => '<span>' + String(i+1).padStart(2,"0") + '</span>' + e(u.titre)).join("<br>") + '</div><p style="margin-top:12mm;font-size:8.5pt;color:var(--muted)">Règles et taux vérifiés au ' + e(d.meta.maj) + '. À vérifier avant tout conseil.</p></div></section>';
  }
  units.forEach(u => {
    const i = d.units.indexOf(u) + 1, f = u.fiche, sch = f.schemas || [], N = String(i).padStart(2,"0");
    const foot = side => '<div class="foot"><span>Learn JC · Fiche ' + N + ' · ' + e(u.titre) + '</span><span>' + side + ' · à jour au ' + e(d.meta.maj) + '</span></div>';
    html += '<section class="sheet recto" id="' + u.id + '"><div class="head"><div class="kicker">Fiche ' + N + ' / ' + d.units.length + '</div><h1>' + e(u.titre) + '</h1><div class="intro"><small>En bref</small>' + e(f.intro) + '</div></div>' +
      '<div class="body"><div><h2>Comment ça marche</h2><div class="points">' + f.points.map((p, k) => '<div class="pt"><span>' + (k+1) + '</span><div><b>' + e(p[0]) + '</b><p>' + e(p[1]) + '</p></div></div>').join("") + '</div></div>' +
      '<div><h2>Les chiffres à connaître</h2><div class="chif">' + f.chiffres.map(c => '<div class="c"><small>' + e(c[0]) + '</small><b>' + e(c[1]) + '</b>' + (c[2] ? '<p>' + e(c[2]) + '</p>' : '') + '</div>').join("") + '</div></div></div>' + foot("Recto") + '</section>';
    html += '<section class="sheet recto2"><div class="body">' +
      (sch.length ? '<div><h2>En schéma</h2><div class="schemas' + (sch.length >= 2 ? " two" : "") + '">' + sch.map(s => '<div class="schema"><h3>' + e(s.title) + '</h3>' + Fiches.render(s) + '</div>').join("") + '</div></div>' : '') +
      '<div><h2>Exemple</h2><div class="ex"><div class="t">' + e(f.exemple.titre) + '</div><ol>' + f.exemple.etapes.map(x => '<li>' + e(x) + '</li>').join("") + '</ol><div class="c2">' + e(f.exemple.conclusion) + '</div></div></div>' +
      '<div class="cols"><div><h2>Les pièges</h2><div class="pg">' + f.pieges.map(p => '<div><b>' + e(p[0]) + '</b><p>' + e(p[1]) + '</p></div>').join("") + '</div></div>' +
      '<div><h2>Les mots à comprendre</h2><dl>' + f.mots.map(m => '<dt>' + e(m[0]) + '</dt><dd>' + e(m[1]) + '</dd>').join("") + '</dl></div></div>' +
      '<div><h2>À dire au client</h2><div class="bubble">' + e(f.phrase) + '</div></div></div>' + foot("Verso") + '</section>';
  });
  root.innerHTML = html;
  fit();
  document.body.dataset.ready = "1";
});
function fit(){
  // Ajuste chaque page : schémas plus petits, puis texte un peu plus petit si besoin
  document.querySelectorAll(".sheet:not(.cover)").forEach(sh => {
    const over = () => { const bd = sh.querySelector(".body"), f = sh.querySelector(".foot"); return bd.lastElementChild.getBoundingClientRect().bottom - f.getBoundingClientRect().top + 4; };
    const svgs = [...sh.querySelectorAll(".schema svg")];
    let mm = 62; while (over() > 0 && svgs.length && mm > 30){ mm -= 2; svgs.forEach(v => v.style.maxHeight = mm + "mm"); }
    let fs = 9.6; while (over() > 0 && fs > 7.8){ fs -= 0.2; sh.style.fontSize = fs + "pt"; }
    if (over() > 0) sh.dataset.overflow = "1";
  });
}
})();
</script>
</body>
</html>
