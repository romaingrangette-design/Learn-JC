<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches mémo conseiller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Une fiche = une page A4. Style banque : blanc, filets fins, vert en accent. */
:root{--ink:#111816;--muted:#6B7570;--green:#007A55;--green-dark:#005C40;--green-soft:#EEF6F2;--line:#E5E9E7;--soft:#F5F7F6;--gold:#B7791F;--bad:#C2372D;--surface:#FFFFFF;
  --body:"Inter",Arial,sans-serif;color-scheme:light}
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#F1F3F2;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.toolbar{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
.toolbar button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.sheet{width:210mm;height:297mm;margin:8mm auto;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.08);position:relative;overflow:hidden;display:flex;flex-direction:column;font-size:9pt;line-height:1.42}
.head{flex:none;padding:12mm 15mm 5mm;border-bottom:1px solid var(--line)}
.kicker{font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:600;display:flex;align-items:center;gap:3mm}
.kicker::before{content:"";width:6mm;height:.7mm;background:var(--green);border-radius:1mm}
.head h1{font-size:22pt;line-height:1.1;margin:2mm 0 3mm;font-weight:700;letter-spacing:-.025em}
.ess{display:flex;flex-direction:column;gap:.8mm;color:#3C4642;font-size:9.4pt}
.ess span::before{content:"—";color:var(--green);margin-right:2mm}
.body{padding:5mm 15mm 12mm;display:flex;flex-direction:column;gap:4.5mm;flex:1}
h2{font-size:7.5pt;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin:0 0 2mm}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tile{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2.2mm 2.8mm}
.tile small{display:block;font-size:7pt;color:var(--muted);margin-bottom:.6mm}
.tile b{font-size:9pt;line-height:1.3;display:block;font-weight:600}
.schemas{display:grid;gap:3mm}
.schema{border:1px solid var(--line);border-radius:2.5mm;padding:3mm 4mm}
.schema h3{margin:0 0 1.5mm;font-size:8.6pt;font-weight:600}
.schema svg text{font-family:var(--body)}
.schema svg{max-height:82mm}
.schemas.two .schema svg{max-height:43mm}
.schemas.two .schema{padding:2.4mm 4mm}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:7mm}
.pieges{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.8mm}
.pieges li{padding-left:4.5mm;position:relative}
.pieges li::before{content:"";position:absolute;left:0;top:1.6mm;width:1.8mm;height:1.8mm;border-radius:50%;background:var(--bad)}
.bubble{border-left:.7mm solid var(--green);padding:.5mm 0 .5mm 3.5mm;font-style:italic;color:#2B3330}
.master{background:var(--soft);border-radius:2.5mm;padding:3mm 4mm}
.master ul{margin:0;padding-left:4mm} .master li{margin:.6mm 0} .master li::marker{color:var(--green)}
.foot{position:absolute;left:15mm;right:15mm;bottom:6mm;display:flex;justify-content:space-between;font-size:6.8pt;color:var(--muted);border-top:1px solid var(--line);padding-top:1.8mm}
.cover .head{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30mm 22mm;border:0}
.cover h1{font-size:34pt;max-width:140mm}
.cover .lead{font-size:12pt;color:var(--muted);max-width:130mm;line-height:1.5}
.cover .toc{columns:2;column-gap:12mm;font-size:10pt;line-height:2;margin-top:12mm;border-top:1px solid var(--line);padding-top:6mm}
.cover .toc span{color:var(--green);font-weight:600;display:inline-block;width:8mm}
@media print{html,body{background:#fff}.toolbar{display:none}.sheet{margin:0;box-shadow:none;page-break-after:always}}
</style>
</head>
<body>
<div class="toolbar"><span>Fiches mémo · une page par thème</span><button type="button" id="print">Imprimer ou enregistrer en PDF</button></div>
<main id="root"></main>
<script src="fiches.js"></script>
<script>
(function(){
const root = document.getElementById("root");
const e = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.getElementById("print").addEventListener("click", () => { try { window.print(); } catch(err){} });
fetch("questions.json").then(r => r.json()).then(d => {
  const only = location.hash.slice(1);
  const units = only ? d.units.filter(u => u.id === only) : d.units;
  let html = "";
  if (!only){
    html += '<section class="sheet cover"><div class="head"><div class="kicker">Learn JC</div><h1>Fiches mémo du conseiller</h1><p class="lead">' + d.units.length + ' fiches d\'une page : l\'essentiel, les chiffres clés, des schémas, les pièges et la phrase à dire au client.</p><div class="toc">' +
      d.units.map((u, i) => '<span>' + String(i+1).padStart(2,"0") + '</span>' + e(u.titre)).join("<br>") + '</div><p style="margin-top:12mm;font-size:8.5pt;color:var(--muted)">Règles et taux vérifiés au ' + e(d.meta.maj) + '. À vérifier avant tout conseil.</p></div></section>';
  }
  units.forEach(u => {
    const i = d.units.indexOf(u) + 1, f = u.fiche, sch = f.schemas || [];
    html += '<section class="sheet" id="' + u.id + '"><div class="head"><div class="kicker">Fiche ' + String(i).padStart(2,"0") + ' / ' + d.units.length + '</div><h1>' + e(u.titre) + '</h1><div class="ess">' + f.essentiel.map(x => '<span>' + e(x) + '</span>').join("") + '</div></div>' +
      '<div class="body"><div><h2>Chiffres clés</h2><div class="tiles">' + f.chiffres.map(c => '<div class="tile"><small>' + e(c[0]) + '</small><b>' + e(c[1]) + '</b></div>').join("") + '</div></div>' +
      '<div class="schemas' + (sch.length >= 2 ? " two" : "") + '">' + sch.map(s => '<div class="schema"><h3>' + e(s.title) + '</h3>' + Fiches.render(s) + '</div>').join("") + '</div>' +
      '<div class="cols"><div><h2>Pièges à éviter</h2><ul class="pieges">' + f.pieges.map(x => '<li>' + e(x) + '</li>').join("") + '</ul></div><div><h2>À dire au client</h2><div class="bubble">' + e(f.phrase) + '</div></div></div>' +
      '<div class="master"><h2>Niveau Maître</h2><ul>' + (u.cours["5"] || []).map(x => '<li>' + e(x) + '</li>').join("") + '</ul></div></div>' +
      '<div class="foot"><span>Learn JC · fiche de révision</span><span>À jour au ' + e(d.meta.maj) + '</span></div></section>';
  });
  root.innerHTML = html;
  fit();
  document.body.dataset.ready = "1";
});
function fit(){
  // Ajuste chaque fiche pour qu'elle tienne sur une page : schémas un peu plus petits, puis section Maître en dernier recours
  document.querySelectorAll(".sheet:not(.cover)").forEach(sh => {
    const over = () => { const bd = sh.querySelector(".body"), f = sh.querySelector(".foot"); return bd.lastElementChild.getBoundingClientRect().bottom - f.getBoundingClientRect().top + 4; };
    const svgs = [...sh.querySelectorAll(".schema svg")];
    let mm = svgs.length > 1 ? 43 : 82;
    while (over() > 0 && mm > 30){ mm -= 2; svgs.forEach(v => v.style.maxHeight = mm + "mm"); }
    if (over() > 0){ const m = sh.querySelector(".master"); if (m) m.remove(); }
  });
}
})();
</script>
</body>
</html>
